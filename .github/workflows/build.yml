name: Build plugin
run-name: Build plugin · ${{ github.ref_name }}

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PNPM_VERSION: 10.28.0

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Backend tests and shell checks
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -v
          TEST_SH=bash python3 -m unittest discover -s tests
          shellcheck install.sh scripts/*.sh
          shellcheck -s sh helpers/winetricks

      - name: Frontend typecheck and build
        run: |
          set -euo pipefail
          npm install -g "pnpm@$PNPM_VERSION"
          pnpm install --frozen-lockfile
          pnpm typecheck
          pnpm build

  versions:
    runs-on: ubuntu-24.04
    outputs:
      tags: ${{ steps.read.outputs.tags }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - id: read
        run: echo "tags=$(jq -Rnc '[inputs | select(length > 0)]' < box64-versions)" >> "$GITHUB_OUTPUT"

  box64:
    needs: versions
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    strategy:
      matrix:
        tag: ${{ fromJSON(needs.versions.outputs.tags) }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # A tag's build only changes with the build script.
      - id: cache
        uses: actions/cache@v6
        with:
          path: bin/box64/${{ matrix.tag }}
          key: box64-${{ matrix.tag }}-${{ hashFiles('scripts/build-box64.sh') }}

      - name: Build Box64 ${{ matrix.tag }}
        if: steps.cache.outputs.cache-hit != 'true'
        run: bash scripts/build-box64.sh "${{ matrix.tag }}"

      - name: Smoke-test Box64 ${{ matrix.tag }}
        run: bin/box64/${{ matrix.tag }}/box64 --version

      - uses: actions/upload-artifact@v7
        with:
          name: box64-${{ matrix.tag }}
          path: bin/box64/${{ matrix.tag }}
          if-no-files-found: error

  package:
    needs: [check, box64]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build the frontend
        run: |
          set -euo pipefail
          npm install -g "pnpm@$PNPM_VERSION"
          pnpm install --frozen-lockfile
          pnpm build

      - name: Collect the Box64 builds
        run: |
          set -euo pipefail
          while read -r tag; do
              [[ -n $tag ]] && mkdir -p "bin/box64/$tag"
          done < box64-versions

      - uses: actions/download-artifact@v8
        with:
          pattern: box64-*
          path: artifacts

      - name: Place the Box64 builds
        run: |
          set -euo pipefail
          while read -r tag; do
              [[ -n $tag ]] || continue
              cp -r "artifacts/box64-$tag/." "bin/box64/$tag/"
              chmod 755 "bin/box64/$tag/box64"
              "bin/box64/$tag/box64" --version
          done < box64-versions

      - name: Build the Windows component helpers
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y autoconf automake autopoint gettext
          bash scripts/build-helpers.sh
          bin/tools/bin/cabextract --version

      - name: Pack the plugin
        run: |
          set -euo pipefail
          bash scripts/package.sh
          cp install.sh out/

      - name: Upload the plugin
        uses: actions/upload-artifact@v7
        with:
          name: ArmadaBox64-run-${{ github.run_number }}
          path: out/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: ArmadaBox64-run-${{ github.run_number }}
          path: out

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" out/* --repo "$GITHUB_REPOSITORY" --title "Armada Box64 $TAG" --generate-notes
